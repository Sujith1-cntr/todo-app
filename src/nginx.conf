# Handle all requests and serve index.html for single-page application (SPA) style routing
# This ensures paths are handled correctly, although not strictly needed for this basic app.
location / {
    try_files $uri $uri/ /index.html;
}

# Optional: Set caching headers for better performance
location ~* \.(css|js|gif|jpe?g|png)$ {
    expires 1y;
    add_header Pragma public;
    add_header Cache-Control "public";
}
