This YAML defines the Continuous Integration (Build) pipeline.

It checks out the code, builds the Docker image, and pushes it to Azure Container Registry (ACR).

trigger:

main # Run pipeline on every push to the 'main' branch

pool:
vmImage: 'ubuntu-latest'

variables:

-----------------------------------------------------------

IMPORTANT: REPLACE THESE WITH YOUR ACTUAL ACR DETAILS

-----------------------------------------------------------

imageRepository: 'todo-app-static' # The name of the repository to create/use in ACR (e.g., todo-app-static)
dockerRegistryServiceConnection: 'YOUR_ACR_SERVICE_CONNECTION_NAME' # The name of the Docker registry service connection you set up in Azure DevOps
acrName: 'youracrhubname' # The name of your Azure Container Registry (e.g., mytodocontainer.azurecr.io)
tag: '$(Build.BuildId)' # Use the unique Build ID as the image tag

stages:

stage: Build
displayName: 'Build and Push Docker Image'
jobs:

job: DockerBuild
displayName: 'Build and Push'
steps:

1. Checkout the source code from GitHub

checkout: self
displayName: 'Checkout Code'

2. Build and push the Docker image to Azure Container Registry (ACR)

This task uses your Dockerfile and the associated nginx.conf.

task: Docker@2
displayName: 'Build and Push Image to ACR'
inputs:
command: 'buildAndPush'
repository: '$(imageRepository)'
dockerfile: 'Dockerfile'
containerRegistry: '$(dockerRegistryServiceConnection)'
tags: '$(tag)'

Context is the root directory where the Dockerfile and source files are located

buildContext: '$(System.DefaultWorkingDirectory)'